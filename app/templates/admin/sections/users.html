<div class="card shadow">
    <div class="card-body">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 mb-3">
            <p class="text-muted mb-0">Bekijk actieve en gedeactiveerde gebruikers, behandel creator-aanvragen en beheer rollen.</p>
            <a href="{{ back_url('admin.panel') }}" class="btn btn-outline-secondary d-none d-sm-inline-flex">Terug naar overzicht</a>
        </div>
        <div class="table-responsive admin-table-responsive">
            <table class="table align-middle admin-table-stack">
                <thead>
                    <tr>
                        <th>Gebruiker</th>
                        <th>Rol</th>
                        <th>Status</th>
                        <th>Aanvraag</th>
                        <th class="text-end">Acties</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                        {% include "/components/user_table_row.html" %}
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
