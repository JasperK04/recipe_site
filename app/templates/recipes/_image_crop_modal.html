<div
	class="form-modal"
	id="recipe-image-crop-modal"
	tabindex="-1"
	role="dialog"
	aria-modal="true"
	aria-labelledby="recipe-image-crop-modal-label"
	hidden
>
	<div class="form-modal-dialog">
		<div class="form-modal-content">
			<div class="form-modal-header">
				<div>
					<p class="form-modal-eyebrow">Afbeelding voorbereiden</p>
					<h2 id="recipe-image-crop-modal-label">
						Receptafbeelding bijsnijden
					</h2>
				</div>
				<button
					type="button"
					class="form-modal-close"
					data-modal-close="recipe-image-crop-modal"
					aria-label="Sluiten"
				>
					&times;
				</button>
			</div>
			<div class="form-modal-body">
				<div
					id="recipe-image-crop-stage"
					class="recipe-image-crop-stage"
				>
					<img
						id="recipe-image-crop-image"
						alt="Voorbeeld van de uitsnede"
					/>
					<div
						id="recipe-image-crop-selection"
						class="recipe-image-crop-selection"
					>
						<button
							type="button"
							class="recipe-image-crop-handle"
							data-crop-handle="nw"
							aria-label="Linkerbovenhoek slepen"
						></button>
						<button
							type="button"
							class="recipe-image-crop-handle"
							data-crop-handle="ne"
							aria-label="Rechterbovenhoek slepen"
						></button>
						<button
							type="button"
							class="recipe-image-crop-handle"
							data-crop-handle="sw"
							aria-label="Linkeronderhoek slepen"
						></button>
						<button
							type="button"
							class="recipe-image-crop-handle"
							data-crop-handle="se"
							aria-label="Rechteronderhoek slepen"
						></button>
					</div>
				</div>
				<p class="recipe-editor-help">
					Sleep het kader om het belangrijkste deel van de foto te
					kiezen. Gebruik de hoeken om de uitsnede te vergroten of
					verkleinen. Op kleine schermen gebruik je de schuifbalk.
				</p>
				<div class="recipe-image-crop-size-control">
					<label for="recipe-image-crop-slider"
						>Grootte van de uitsnede</label
					>
					<input
						id="recipe-image-crop-slider"
						class="form-range"
						type="range"
						min="0"
						max="100"
						value="100"
						aria-label="Grootte van de uitsnede"
					/>
				</div>
			</div>
			<div class="form-modal-footer">
				<button
					type="button"
					class="button button-secondary"
					data-modal-close="recipe-image-crop-modal"
				>
					Annuleren
				</button>
				<button
					id="recipe-image-crop-confirm"
					type="button"
					class="button button-primary"
					disabled
				>
					Deze uitsnede gebruiken
				</button>
			</div>
		</div>
	</div>
</div>
